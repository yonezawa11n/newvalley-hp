<script>
function hdSubmit(e) {
  e.preventDefault();
  var form = e.target, box = form.parentNode, fd = new FormData(form), d = Object.fromEntries(fd.entries());
  var err = box.querySelector('.hd-err'), btn = box.querySelector('.hd-btn');
  err.style.display = 'none';
  var need = d.contact === '電話' ? d.tel : d.email;
  if (!String(need || '').trim()) { err.textContent = (d.contact === '電話' ? '電話番号' : 'メールアドレス') + 'を入力してください。'; err.style.display = 'block'; return; }
  var fac = fd.getAll('facility').join('、') || '未選択';
  var msg = ['ご用件：' + d.purpose, '希望の連絡方法：' + d.contact, '', 'お子さんの年齢：' + d.age,
    '学校：' + (d.schoolStatus || '未選択') + ' ' + (d.school || ''), '受給者証：' + (d.jukyu || '未選択'),
    '相談支援事業所：' + (d.soudan || '未入力'), '担当者：' + (d.tanto || '未入力'), '気になる事業所：' + fac, '', 'ご相談内容：', d.message || '（なし）'].join('\n');
  btn.disabled = true; btn.textContent = '送信中...';
  fetch('/api/contact', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: d.name, email: d.email, tel: d.tel, facility: fac, type: '放デイ ' + d.purpose + '（連絡希望：' + d.contact + '）', message: msg }) })
    .then(function (r) { return r.json(); })
    .then(function (r) { if (!r.ok) throw 0; form.style.display = 'none'; box.querySelector('.hd-way').textContent = d.contact; box.querySelector('.hd-ok').style.display = 'block'; scrollTo(0, 0); })
    .catch(function () { err.textContent = '送信できませんでした。時間をおいて再度お試しください。'; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'この内容で申し込む'; });
}
</script>
